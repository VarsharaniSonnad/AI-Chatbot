<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Alphaleo Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div id="chat-container">
    <div id="chat-header">Ask Alphaleo</div>

    <div id="chat-messages"></div>

    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Ask a question about Alphaleo..." autocomplete="off" />
      <button id="chat-send">Send</button>
    </div>
  </div>

  <script>
    // Point this at your running backend (main.py). Change once you deploy.
    const API_URL = "https://alphaleoaichatbot-c5ccbfdhd7gcfgaq.southindia-01.azurewebsites.net/chat";
    const messagesEl = document.getElementById("chat-messages");
    const inputEl = document.getElementById("chat-input");
    const sendBtn = document.getElementById("chat-send");

    // Fixed greeting — always identical, not generated by the LLM.
    // Explicitly discloses this is an AI assistant, like Microsoft's Store Assistant does.
    const GREETING =
      "Hi, I'm Alphaleo's AI Assistant. I can help you explore our services and solutions. " +
      "I can also connect you with a Alphaleo Sales Associate . What can I do for you?";
    function formatMarkdown(text) {
  // escape HTML first to avoid injection
  let safe = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // **bold** -> <strong>
  safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

  // lines starting with "* " -> <li>, wrapped in <ul>
  const lines = safe.split("\n");
  let html = "";
  let inList = false;
  for (const line of lines) {
    if (line.trim().startsWith("* ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${line.trim().slice(2)}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (line.trim()) html += `<p>${line}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html;
}
    function addMessage(text, who, sources) {
      const wrapper = document.createElement("div");
      wrapper.className = `msg ${who}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = formatMarkdown(text);
      wrapper.appendChild(bubble);

      if (sources && sources.length) {
        const src = document.createElement("div");
        src.className = "sources";
        src.innerHTML = sources
          .map((s) => `<a href="${s.url}" target="_blank" rel="noopener">${s.title || s.url}</a>`)
          .join(" · ");
        wrapper.appendChild(src);
      }

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrapper;
    }
    let conversationHistory = []; // {role: "user"|"assistant", text: "..."}

    async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.disabled = true;
    sendBtn.disabled = true;

    addMessage(text, "user");
    inputEl.value = "";
    const thinking = addMessage("Thinking...", "bot");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: conversationHistory }),
      });
      const data = await res.json();
      thinking.remove();
      addMessage(data.answer || "No answer returned.", "bot");
      conversationHistory.push({ role: "user", text: text });
      conversationHistory.push({ role: "assistant", text: data.answer || "" });
    } catch (err) {
      thinking.remove();
      addMessage("Couldn't reach the chatbot server. Is main.py running?", "bot");
    } finally {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Show the fixed greeting as soon as the widget loads — no API call needed for this.
    addMessage(GREETING, "bot");
  </script>

</body>
</html>
